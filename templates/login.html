<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Hostel Management System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
</head>
<body>
<div class="login-page">

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="flash-container">
        {% for cat, msg in messages %}
          <div class="flash-alert alert-{{ cat }}">
            <i class="bi bi-{% if cat=='success' %}check-circle-fill{% elif cat=='danger' %}x-circle-fill{% else %}info-circle-fill{% endif %}"></i>
            <span>{{ msg }}</span>
            <button class="btn-close" type="button">&times;</button>
          </div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <div class="login-card">
    <div class="login-logo"><i class="bi bi-building"></i></div>
    <div class="login-title">HMS Portal</div>
    <div class="login-subtitle">Hostel Management System &mdash; Admin Login</div>

    <form method="POST" action="{{ url_for('login') }}" novalidate>
      <div class="mb-4">
        <label class="form-label">Username</label>
        <div style="position:relative;">
          <i class="bi bi-person" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.35);font-size:16px;"></i>
          <input type="text" name="username" class="form-control" placeholder="Enter username"
                 style="padding-left:42px;" required autocomplete="username"/>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label">Password</label>
        <div class="pass-toggle" style="position:relative;">
          <i class="bi bi-lock" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.35);font-size:16px;z-index:2;"></i>
          <input type="password" name="password" class="form-control" placeholder="Enter password"
                 style="padding-left:42px;padding-right:44px;" required autocomplete="current-password"/>
          <i class="bi bi-eye-slash toggle-icon"></i>
        </div>
      </div>

      <button type="submit" class="login-btn">
        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In to Dashboard
      </button>
    </form>

    <div class="login-footer">
      <i class="bi bi-shield-lock me-1"></i>
      Default credentials: <strong style="color:rgba(255,255,255,.4);">admin</strong> / <strong style="color:rgba(255,255,255,.4);">admin123</strong>
    </div>
  </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
